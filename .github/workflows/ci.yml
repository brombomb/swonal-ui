name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-app:
    name: Server App (Typecheck, Build & Tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/server-app
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/server-app/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Prepare Seeded Test SQLite Database
        env:
          DATABASE_URL: file:./data/swonal.db
        run: |
          mkdir -p prisma/data
          npx prisma db push
          npx tsx prisma/seed.ts

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: Production Build
        run: npm run build

      - name: Run Unit & Integration Tests
        env:
          DATABASE_URL: file:./data/swonal.db
        run: npm test

  tonal-daemon:
    name: Tonal Daemon (Lint & Safety Tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/tonal-daemon
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: packages/tonal-daemon/pyproject.toml

      - name: Install Dependencies
        run: pip install -e ".[dev]" ruff

      - name: Ruff Static Checks (Syntax & Undefined Names)
        run: ruff check --select E9,F63,F7,F82 src tests

      - name: Run Pytest Suite
        run: pytest -v

  android-kiosk:
    name: Android Kiosk (Unit Tests & Debug Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/android-kiosk
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Unit Tests & Compile Debug APK
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --console=plain
