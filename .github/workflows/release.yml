name: Release & Binary Distribution

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  release-please:
    name: Automated Release PR & Tagging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-apk:
    name: Build Android Kiosk APK
    needs: [release-please]
    if: ${{ !cancelled() && ((startsWith(github.ref, 'refs/tags/v') && needs.release-please.result == 'skipped') || (needs.release-please.result == 'success' && needs.release-please.outputs.release_created == 'true')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name || github.ref_name }}

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/server-app/package-lock.json

      - name: Build Embedded Web SPA Assets
        run: |
          cd packages/server-app
          npm ci
          npm run build:client

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode Release Keystore (if configured)
        env:
          SWONAL_KEYSTORE_BASE64: ${{ secrets.SWONAL_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SWONAL_KEYSTORE_BASE64" ]; then
            python3 - <<'PY'
          import base64, binascii, os, sys

          raw = os.environ.get("SWONAL_KEYSTORE_BASE64", "")
          # Strip whitespace/newlines and accidental surrounding quotes from copy-paste.
          cleaned = "".join(raw.split()).strip("'\"")
          # Support URL-safe base64 and restore missing '=' padding if truncated.
          cleaned = cleaned.replace("-", "+").replace("_", "/")
          if len(cleaned) % 4:
              cleaned += "=" * (4 - (len(cleaned) % 4))

          try:
              data = base64.b64decode(cleaned, validate=True)
          except binascii.Error as exc:
              print(
                  f"::error::SWONAL_KEYSTORE_BASE64 is not valid base64 ({exc}; cleaned length={len(cleaned)}). "
                  "Re-encode your keystore with `base64 -w 0 <keystore.jks>` and update the GitHub Actions secret.",
                  file=sys.stderr,
              )
              sys.exit(1)

          if not data:
              print("::error::SWONAL_KEYSTORE_BASE64 decoded to 0 bytes.", file=sys.stderr)
              sys.exit(1)

          out_path = os.path.join(os.environ["RUNNER_TEMP"], "swonal-release.jks")
          with open(out_path, "wb") as f:
              f.write(data)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"SWONAL_KEYSTORE_PATH={out_path}\n")
          print(f"Release keystore configured ({len(data)} bytes).")
          PY
          else
            echo "SWONAL_KEYSTORE_BASE64 not set; falling back to default signing config."
          fi

      - name: Build Kiosk APK
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name || github.ref_name }}
          SWONAL_KEYSTORE_PASSWORD: ${{ secrets.SWONAL_KEYSTORE_PASSWORD }}
          SWONAL_KEY_ALIAS: ${{ secrets.SWONAL_KEY_ALIAS }}
          SWONAL_KEY_PASSWORD: ${{ secrets.SWONAL_KEY_PASSWORD }}
        run: |
          VER="${RELEASE_TAG#v}"
          IFS='.' read -r MAJ MIN PAT <<< "${VER%%-*}"
          VCODE=$(( ${MAJ:-1} * 10000 + ${MIN:-0} * 100 + ${PAT:-0} ))
          echo "Building Swonal Kiosk versionName=$VER versionCode=$VCODE (tag=$RELEASE_TAG)"
          cd packages/android-kiosk
          ./gradlew assembleRelease -PswonalVersionName="$VER" -PswonalVersionCode="$VCODE" --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: swonal-kiosk-apk
          path: packages/android-kiosk/app/build/outputs/apk/release/app-release.apk

  build-server:
    name: Build Server App Bundle
    needs: [release-please]
    if: ${{ !cancelled() && ((startsWith(github.ref, 'refs/tags/v') && needs.release-please.result == 'skipped') || (needs.release-please.result == 'success' && needs.release-please.outputs.release_created == 'true')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name || github.ref_name }}

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install & Build Server
        run: |
          cd packages/server-app
          npm ci
          npx prisma generate
          npm run build
          tar -czvf ../../swonal-server-bundle.tar.gz dist/ prisma/ package.json package-lock.json node_modules/.prisma

      - name: Upload Server Artifact
        uses: actions/upload-artifact@v4
        with:
          name: swonal-server-bundle
          path: swonal-server-bundle.tar.gz

  create-release:
    name: Publish GitHub Release Assets
    needs: [release-please, build-apk, build-server]
    if: ${{ !cancelled() && needs.build-apk.result == 'success' && needs.build-server.result == 'success' && (needs.release-please.result == 'success' || needs.release-please.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name || github.ref_name }}

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: swonal-kiosk-apk
          path: release-artifacts/

      - name: Download Server
        uses: actions/download-artifact@v4
        with:
          name: swonal-server-bundle
          path: release-artifacts/

      - name: Rename APK
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name || github.ref_name }}
        run: |
          mv release-artifacts/app-release.apk "release-artifacts/swonal-kiosk-${RELEASE_TAG}.apk"

      - name: Attach Assets to Release Please Release
        if: needs.release-please.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "release-artifacts/swonal-kiosk-${RELEASE_TAG}.apk" \
            "release-artifacts/swonal-server-bundle.tar.gz" \
            --clobber

      - name: Extract Human-Readable Changelog (Manual Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - "$RELEASE_TAG" <<'PY' > release-notes.md
          import re, sys
          tag = sys.argv[1]
          ver = tag.lstrip("v")
          try:
              text = open("CHANGELOG.md", encoding="utf-8").read()
          except FileNotFoundError:
              sys.exit(0)
          pattern = rf"^##\s+\[?v?{re.escape(ver)}\]?[^\n]*\n(.*?)(?=^##\s+|\Z)"
          m = re.search(pattern, text, flags=re.M | re.S)
          if m:
              print(m.group(1).strip())
          PY

      - name: Create GitHub Release (Manual Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: release-notes.md
          generate_release_notes: true
          files: |
            release-artifacts/swonal-kiosk-${{ github.ref_name }}.apk
            release-artifacts/swonal-server-bundle.tar.gz

      - name: Notify Discord (if configured)
        continue-on-error: true
        env:
          DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name || github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [ -z "$DISCORD_RELEASE_WEBHOOK" ]; then
            echo "DISCORD_RELEASE_WEBHOOK not set; skipping Discord notification."
            exit 0
          fi
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error

          webhook = os.environ["DISCORD_RELEASE_WEBHOOK"].strip()
          if webhook.endswith("/github"):
              webhook = webhook[:-len("/github")]
          tag = os.environ["RELEASE_TAG"].strip()
          repo = os.environ["GITHUB_REPOSITORY"].strip()
          is_pre = "-" in tag
          release_url = f"https://github.com/{repo}/releases/tag/{tag}"
          apk_url = f"https://github.com/{repo}/releases/download/{tag}/swonal-kiosk-{tag}.apk"

          notes = ""
          if os.path.exists("release-notes.md"):
              notes = open("release-notes.md", encoding="utf-8").read().strip()
          if not notes:
              notes = (
                  "New pre-release build available for testing."
                  if is_pre
                  else "New stable release available."
              )
          if len(notes) > 1800:
              notes = notes[:1797] + "..."

          payload = {
              "username": "Swonal Releases",
              "embeds": [
                  {
                      "title": f"Swonal {tag} {'(Pre-release)' if is_pre else 'Released'}",
                      "url": release_url,
                      "description": notes,
                      "color": 0xF59E0B if is_pre else 0x10B981,
                      "fields": [
                          {
                              "name": "Android Kiosk APK",
                              "value": f"[swonal-kiosk-{tag}.apk]({apk_url})",
                              "inline": True,
                          },
                          {
                              "name": "Release Page",
                              "value": f"[View on GitHub]({release_url})",
                              "inline": True,
                          },
                      ],
                  }
              ],
          }

          req = urllib.request.Request(
              webhook,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "Swonal-Release-Bot/1.0",
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(req, timeout=15) as resp:
                  print(f"Discord notification sent (HTTP {resp.status}).")
          except urllib.error.HTTPError as exc:
              print(f"::warning::Discord webhook returned HTTP {exc.code}: {exc.reason}")
          except Exception as exc:
              print(f"::warning::Failed to post Discord notification: {exc}")
          PY
