name: Release & Binary Distribution

on:
  push:
    tags:
      - 'v*'

jobs:
  build-apk:
    name: Build Android Kiosk APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Kiosk APK
        run: |
          cd packages/android-kiosk
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: swonal-kiosk-apk
          path: packages/android-kiosk/app/build/outputs/apk/release/app-release.apk

  build-server:
    name: Build Server App Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install & Build Server
        run: |
          cd packages/server-app
          npm ci
          npx prisma generate
          npm run build
          tar -czvf ../../swonal-server-bundle.tar.gz dist/ prisma/ package.json

      - name: Upload Server Artifact
        uses: actions/upload-artifact@v4
        with:
          name: swonal-server-bundle
          path: swonal-server-bundle.tar.gz

  create-release:
    name: Publish GitHub Release
    needs: [build-apk, build-server]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: swonal-kiosk-apk
          path: release-artifacts/

      - name: Download Server
        uses: actions/download-artifact@v4
        with:
          name: swonal-server-bundle
          path: release-artifacts/

      - name: Rename APK
        run: |
          mv release-artifacts/app-release.apk release-artifacts/swonal-kiosk-${{ github.ref_name }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/swonal-kiosk-${{ github.ref_name }}.apk
            release-artifacts/swonal-server-bundle.tar.gz
          name: Swonal UI ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
