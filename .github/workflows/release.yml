name: Release & Binary Distribution

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  release-please:
    name: Automated Release PR & Tagging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-apk:
    name: Build Android Kiosk APK
    needs: [release-please]
    if: ${{ !cancelled() && ((startsWith(github.ref, 'refs/tags/v') && needs.release-please.result == 'skipped') || (needs.release-please.result == 'success' && needs.release-please.outputs.release_created == 'true')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name || github.ref_name }}

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/server-app/package-lock.json

      - name: Build Embedded Web SPA Assets
        run: |
          cd packages/server-app
          npm ci
          npm run build:client

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode Release Keystore (if configured)
        env:
          SWONAL_KEYSTORE_BASE64: ${{ secrets.SWONAL_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SWONAL_KEYSTORE_BASE64" ]; then
            echo "$SWONAL_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/swonal-release.jks"
            echo "SWONAL_KEYSTORE_PATH=$RUNNER_TEMP/swonal-release.jks" >> "$GITHUB_ENV"
            echo "Release keystore configured."
          else
            echo "SWONAL_KEYSTORE_BASE64 not set; falling back to default signing config."
          fi

      - name: Build Kiosk APK
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name || github.ref_name }}
          SWONAL_KEYSTORE_PASSWORD: ${{ secrets.SWONAL_KEYSTORE_PASSWORD }}
          SWONAL_KEY_ALIAS: ${{ secrets.SWONAL_KEY_ALIAS }}
          SWONAL_KEY_PASSWORD: ${{ secrets.SWONAL_KEY_PASSWORD }}
        run: |
          VER="${RELEASE_TAG#v}"
          IFS='.' read -r MAJ MIN PAT <<< "${VER%%-*}"
          VCODE=$(( ${MAJ:-1} * 10000 + ${MIN:-0} * 100 + ${PAT:-0} ))
          echo "Building Swonal Kiosk versionName=$VER versionCode=$VCODE (tag=$RELEASE_TAG)"
          cd packages/android-kiosk
          ./gradlew assembleRelease -PswonalVersionName="$VER" -PswonalVersionCode="$VCODE" --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: swonal-kiosk-apk
          path: packages/android-kiosk/app/build/outputs/apk/release/app-release.apk

  build-server:
    name: Build Server App Bundle
    needs: [release-please]
    if: ${{ !cancelled() && ((startsWith(github.ref, 'refs/tags/v') && needs.release-please.result == 'skipped') || (needs.release-please.result == 'success' && needs.release-please.outputs.release_created == 'true')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name || github.ref_name }}

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install & Build Server
        run: |
          cd packages/server-app
          npm ci
          npx prisma generate
          npm run build
          tar -czvf ../../swonal-server-bundle.tar.gz dist/ prisma/ package.json package-lock.json node_modules/.prisma

      - name: Upload Server Artifact
        uses: actions/upload-artifact@v4
        with:
          name: swonal-server-bundle
          path: swonal-server-bundle.tar.gz

  create-release:
    name: Publish GitHub Release Assets
    needs: [release-please, build-apk, build-server]
    if: ${{ !cancelled() && needs.build-apk.result == 'success' && needs.build-server.result == 'success' && (needs.release-please.result == 'success' || needs.release-please.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name || github.ref_name }}

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: swonal-kiosk-apk
          path: release-artifacts/

      - name: Download Server
        uses: actions/download-artifact@v4
        with:
          name: swonal-server-bundle
          path: release-artifacts/

      - name: Rename APK
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name || github.ref_name }}
        run: |
          mv release-artifacts/app-release.apk "release-artifacts/swonal-kiosk-${RELEASE_TAG}.apk"

      - name: Attach Assets to Release Please Release
        if: needs.release-please.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "release-artifacts/swonal-kiosk-${RELEASE_TAG}.apk" \
            "release-artifacts/swonal-server-bundle.tar.gz" \
            --clobber

      - name: Extract Human-Readable Changelog (Manual Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - "$RELEASE_TAG" <<'PY' > release-notes.md
          import re, sys
          tag = sys.argv[1]
          ver = tag.lstrip("v")
          try:
              text = open("CHANGELOG.md", encoding="utf-8").read()
          except FileNotFoundError:
              sys.exit(0)
          pattern = rf"^##\s+\[?v?{re.escape(ver)}\]?[^\n]*\n(.*?)(?=^##\s+|\Z)"
          m = re.search(pattern, text, flags=re.M | re.S)
          if m:
              print(m.group(1).strip())
          PY

      - name: Create GitHub Release (Manual Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          generate_release_notes: true
          files: |
            release-artifacts/swonal-kiosk-${{ github.ref_name }}.apk
            release-artifacts/swonal-server-bundle.tar.gz
