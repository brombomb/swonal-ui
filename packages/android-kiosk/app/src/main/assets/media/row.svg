<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="240" height="180">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0D121B"/>
      <stop offset="100%" stop-color="#07090E"/>
    </linearGradient>
  </defs>
  <rect width="240" height="180" rx="14" fill="url(#bg)" stroke="#1E293B" stroke-width="2"/>
  <!-- Tonal Pillar -->
  <rect x="108" y="24" width="24" height="118" rx="4" fill="#161E2E" stroke="#334155" stroke-width="1.5"/>
  <!-- Tonal Arms -->
  <line x1="108" y1="105" x2="60" y2="105" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
  <line x1="132" y1="105" x2="180" y2="105" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
  <!-- Animated Cables -->
  <line x1="60" y1="105" x2="92" y2="105" stroke="#10B981" stroke-width="2.5" stroke-dasharray="4 3">
    <animate attributeName="y2" values="105;105;105" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="60;92;60" dur="2.4s" repeatCount="indefinite"/>
  </line>
  <line x1="180" y1="105" x2="148" y2="105" stroke="#10B981" stroke-width="2.5" stroke-dasharray="4 3">
    <animate attributeName="y2" values="105;105;105" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="180;148;180" dur="2.4s" repeatCount="indefinite"/>
  </line>
  <!-- Animated Grip Nodes -->
  <circle cx="60" cy="105" r="7" fill="#10B981">
    <animate attributeName="cy" values="105;105;105" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="60;92;60" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="180" cy="105" r="7" fill="#10B981">
    <animate attributeName="cy" values="105;105;105" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="180;148;180" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <text x="120" y="18" text-anchor="middle" fill="#10B981" font-family="monospace" font-size="10" font-weight="bold" letter-spacing="1.5">CABLE ROW</text>
  <text x="120" y="166" text-anchor="middle" fill="#94A3B8" font-family="sans-serif" font-size="10">Squeeze shoulder blades back</text>
</svg>