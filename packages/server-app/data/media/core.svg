<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="240" height="180">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0D121B"/>
      <stop offset="100%" stop-color="#07090E"/>
    </linearGradient>
  </defs>
  <rect width="240" height="180" rx="14" fill="url(#bg)" stroke="#1E293B" stroke-width="2"/>
  <!-- Tonal Pillar -->
  <rect x="108" y="24" width="24" height="118" rx="4" fill="#161E2E" stroke="#334155" stroke-width="1.5"/>
  <!-- Tonal Arms -->
  <line x1="108" y1="95" x2="55" y2="95" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
  <line x1="132" y1="95" x2="185" y2="95" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
  <!-- Animated Cables -->
  <line x1="55" y1="95" x2="81" y2="111" stroke="#10B981" stroke-width="2.5" stroke-dasharray="4 3">
    <animate attributeName="y2" values="95;111;95" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="55;81;55" dur="2.4s" repeatCount="indefinite"/>
  </line>
  <line x1="185" y1="95" x2="159" y2="111" stroke="#10B981" stroke-width="2.5" stroke-dasharray="4 3">
    <animate attributeName="y2" values="95;111;95" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="185;159;185" dur="2.4s" repeatCount="indefinite"/>
  </line>
  <!-- Animated Grip Nodes -->
  <circle cx="55" cy="95" r="7" fill="#10B981">
    <animate attributeName="cy" values="95;111;95" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="55;81;55" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="185" cy="95" r="7" fill="#10B981">
    <animate attributeName="cy" values="95;111;95" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="185;159;185" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <text x="120" y="18" text-anchor="middle" fill="#10B981" font-family="monospace" font-size="10" font-weight="bold" letter-spacing="1.5">CORE / ROTATION</text>
  <text x="120" y="166" text-anchor="middle" fill="#94A3B8" font-family="sans-serif" font-size="10">Anti-rotation braced trunk</text>
</svg>