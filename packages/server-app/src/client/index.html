<!doctype html>
<html lang="en" data-theme="dark" style="background-color: #06090e; color: #f8fafc; color-scheme: dark;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>swonal-ui — Smart Home Gym Controller</title>
    <meta name="theme-color" content="#06090e" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root, html, body {
        background-color: #06090e !important;
        color: #f8fafc;
        color-scheme: dark;
        margin: 0;
        padding: 0;
        min-height: 100vh;
      }
      #root {
        background-color: #06090e;
        min-height: 100vh;
      }
      #initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #06090e;
        color: #94a3b8;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 14px;
        font-weight: 600;
        gap: 16px;
        z-index: 99999;
      }
      .initial-spinner {
        width: 32px;
        height: 32px;
        border: 3px solid rgba(0, 240, 255, 0.15);
        border-top-color: #00f0ff;
        border-radius: 50%;
        animation: initial-spin 0.8s linear infinite;
      }
      @keyframes initial-spin {
        to { transform: rotate(360deg); }
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body style="background-color: #06090e; color: #f8fafc; color-scheme: dark; margin: 0;">
    <div id="root">
      <div id="initial-loader">
        <div class="initial-spinner"></div>
        <span>Loading Swonal...</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
